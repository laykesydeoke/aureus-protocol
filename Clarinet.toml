[project]
name = 'aureus-protocol'
description = 'Aureus Protocol - Institutional Digital Asset Optimization Platform with Clarity 4'
authors = []
telemetry = true
cache_dir = './.cache'
requirements = []

[contracts.mock-sbtc]
path = 'contracts/mock-sbtc.clar'
clarity_version = 4
epoch = 'latest'

[contracts.protocol-adapter]
path = 'contracts/protocol-adapter.clar'
clarity_version = 4
epoch = 'latest'

[contracts.yield-aggregator]
path = 'contracts/yield-aggregator.clar'
clarity_version = 4
epoch = 'latest'

[repl.analysis]
passes = ['check_checker']

[repl.analysis.check_checker]
strict = false
trusted_sender = false
trusted_caller = false
callee_filter = false

[repl.remote_data]
enabled = false
api_url = 'https://api.hiro.so'
