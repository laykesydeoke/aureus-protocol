name: Asset Tests

on:
  push:
    branches: [feat/multi-asset-support, main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run test:assets
      - run: npm run test:asset-access
      - run: npm run test:asset-flow
