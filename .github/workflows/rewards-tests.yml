name: Deposit Rewards Tests

on:
  push:
    branches: [ feat/deposit-rewards ]
  pull_request:
    branches: [ main ]

jobs:
  test-rewards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run rewards tests
        run: npm run test:rewards
      - name: Run loyalty tests
        run: npm run test:loyalty
      - name: Run edge tests
        run: npm run test:reward-edge
