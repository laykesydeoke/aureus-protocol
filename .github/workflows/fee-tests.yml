name: Fee Management Tests
on:
  push:
    branches: [feat/fee-management, main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run test:fees
      - run: npm run test:fee-edge
