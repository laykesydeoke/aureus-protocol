name: Performance Tests

on:
  push:
    branches: [feat/performance-metrics, main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run test:perf
      - run: npm run test:perf-integration
      - run: npm run test:perf-edge
