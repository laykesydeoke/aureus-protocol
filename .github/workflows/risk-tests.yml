name: Risk Tests

on:
  push:
    branches: [feat/risk-management, main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run test:risk
      - run: npm run test:risk-limits
      - run: npm run test:circuit
